# GitHub disables scheduled workflows on repos with no activity for 60 days.
# One tiny commit a month keeps the dead-man's schedule alive.
name: keepalive
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "keepalive"
          git config user.email "actions@github.com"
          git add .keepalive
          git commit -m "chore: keepalive" && git push
